<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TaskTape</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 360px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
    main { padding: 12px 14px 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .live { border-color: #fecaca; background: var(--red-soft); }
    .live.run { border-color: #c7d2fe; background: var(--accent-soft); }
    .live strong { color: var(--ink); display: block; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .list-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow: auto; }
    li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
    .item { display: flex; align-items: center; gap: 8px; }
    .item .info { flex: 1; min-width: 0; }
    .item .name { font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .vars { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
    .empty { text-align: center; color: var(--muted); padding: 16px 8px; font-size: 12px; }
    #search { margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">▶</span>TaskTape</div>
    <button id="openManager" class="btn small ghost" title="Open the manager in a tab">Manage ↗</button>
  </header>
  <main>
    <section id="live" class="card live hidden"></section>

    <section id="recordBox" class="card">
      <label class="field">What are you going to record?
        <input id="name" placeholder="e.g. Download the weekly sales report" maxlength="80">
      </label>
      <div class="row" style="margin-top: 8px;">
        <button id="record" class="btn red" style="flex: 1;">● Record on this page</button>
      </div>
      <p class="hint">Do the task once as usual, then press <b>Stop</b> in the red bar at the bottom of the page.</p>
    </section>

    <div class="list-head">
      <h2>My automations</h2>
      <span id="count" class="muted" style="font-size: 12px;"></span>
    </div>
    <input id="search" class="hidden" placeholder="Search…">
    <ul id="list"></ul>
    <p id="error" class="error hidden"></p>
  </main>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
